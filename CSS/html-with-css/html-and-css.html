<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML-CSS</title>
</head>
<body>
<!--
 Указываем атрибут style для css внутри тега html
-->
<p style="color: green; font-size: 24px;">
  Это пример текста со встроенной стилем CSS
</p>

<hr>
<br>

<div style="width:40%; height:50px;color:white;background-color:black">
  Белый текст на черном фоне
</div>

<hr>
<br>
<div style="color: #ff0000; background-color: #00ff00;">
  Красный на зеленом
</div>

<hr>
<br>

<h2 style="color: green">Цвета</h2>
<img src="color.png" alt="image colors">

</body>
</html>
